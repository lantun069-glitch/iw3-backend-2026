spring.application.name=iw3

dev.info.enabled=true

spring.jackson.time-zone=America/Argentina/Buenos_Aires

spring.datasource.url=jdbc:mysql://localhost:33306/iw3_2026?createDatabaseIfNotExist=true&verifyServerCertificate=false&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

#ERROR
#WARN 
#INFO 
#DEBUG
#TRACE

logging.level.root=WARN
logging.level.org.springframework.orm.jpa=ERROR
logging.level.org.springframework.transaction=ERROR

spring.jpa.properties.hibernate.generate_statistics=false
logging.level.org.hibernate.stat=WARN
logging.level.org.hibernate.type=WARN

logging.level.com.zaxxer.hikari.HikariConfig=DEBUG 
logging.level.com.zaxxer.hikari=INFO
logging.level.ar.edu.iua.iw3.util.EmailBusiness=TRACE

spring.datasource.hikari.connection-timeout=60000 
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.idle-timeout=600000  
spring.datasource.hikari.max-lifetime=1800000 
spring.datasource.hikari.auto-commit=false

logging.level.ar.edu.iua.iw3.Iw3Application=DEBUG
logging.level.ar.edu.iua.iw3.schedules.Scheduler=TRACE

# Destinatario de notificaciones (ej. productos por vencer). Sin direccion
# por defecto: configurar via NOTIFY_TEST_RECIPIENT cuando se necesite probar.
expired.product.send.to=${NOTIFY_TEST_RECIPIENT:}

# Job heredado de notificacion de productos vencidos: deshabilitado por
# defecto. No depende del perfil activo ni de que el repositorio de cli2
# quede null; es una condicion de configuracion explicita.
jobs.expired-notification.enabled=${EXPIRED_NOTIFICATION_ENABLED:false}

logging.level.ar.edu.iua.iw3.auth.custom.JWTAuthorizationFilter=TRACE
logging.level.ar.edu.iua.iw3.auth.events.UserEventListener=DEBUG

# Servidor SMTP: default = el de la catedra (Gmail); no asumir que aplica
# a otras cuentas. Configurar SMTP_HOST/SMTP_PORT reales cuando se confirmen.
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USER}
spring.mail.password=${SMTP_PASS}

# Remitente de los mensajes. Sin direccion propia todavia: por defecto usa
# el mismo usuario autenticado por SMTP (SMTP_USER). Configurar MAIL_FROM
# solo cuando se confirme que el proveedor permite enviar desde esa direccion.
mail.from=${MAIL_FROM:${spring.mail.username}}

jwt.secret=${JWT_SECRET}
# Default = true/true (requerido por un proveedor real como Gmail).
# Configurables via env var SOLO para apuntar a un receptor SMTP local de
# prueba (sin autenticacion ni STARTTLS) en el entorno de desarrollo; no
# se cambia el default de produccion (TP28/TP29, F6, segunda unidad).
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}



